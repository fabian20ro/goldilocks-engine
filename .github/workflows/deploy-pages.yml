name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Frozen candidate tag or commit SHA; must resolve to GITHUB_SHA
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref }}
      - name: Require exact frozen candidate
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REF"
          actual="$(git rev-parse HEAD)"
          expected="$(git rev-parse --verify --end-of-options "${CANDIDATE_REF}^{commit}")"
          test "$actual" = "$expected"
          test "$actual" = "$GITHUB_SHA"
          {
            printf 'candidate_ref=%s\n' "$CANDIDATE_REF"
            printf 'candidate_sha=%s\n' "$actual"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install locked dependencies
        run: npm ci
      - name: Build repository-path package
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
